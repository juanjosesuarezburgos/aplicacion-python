name: CI/CD Completo - Test, Build y Actualización de Helm

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4
      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 3. Instalar Herramientas (pytest)
        run: pip install pytest
      - name: 4. Ejecutar Pruebas Unitarias
        run: pytest

  build-and-push:
    name: Construir y Publicar Imagen en GHCR
    runs-on: ubuntu-latest
    needs: test 
    outputs:
      image_tag: ${{ steps.meta.outputs.version }} 

    steps:
      - name: 1. Descargar código fuente
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # El usuario que disparó el push
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub

      # 3. Generar el Tag de la Imagen (ej: sha-abcdef)
      - name: 3. Generar metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juanjosuarezburgos/aplicacion-python/aplicacion
          tags: |
            type=sha,prefix=,format=short

      - name: 4. Construir y subir la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  update-helm-repo:
    name: Actualizar Repositorio Helm
    runs-on: ubuntu-latest
    needs: build-and-push 

    steps:
      - name: 1. Descargar el repositorio de configuración Helm
        uses: actions/checkout@v4
        with:
          repository: juanjosuarezburgos/charts-helm 
          token: ${{ secrets.PAT_TOKEN }} 

      - name: 2. Instalar 'yq' (herramienta para editar YAML)
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: 3. Actualizar el tag de la imagen en values.yaml
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          # Actualiza el valor 'tag' dentro del archivo values.yaml
          yq e -i '.image.tag = env(IMAGE_TAG)' ./charts/aplicacion/values.yaml
          echo "Helm chart actualizado para usar el tag: $IMAGE_TAG"

      - name: 4. Hacer commit y subir los cambios de configuración
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.actions'
          git add ./charts/aplicacion/values.yaml
          git commit -m "CI: Actualiza imagen a ${{ needs.build-and-push.outputs.image_tag }}"
          git push
